name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual triggering from the UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Free disk before build
        run: |
          df -h
          docker system prune -af --volumes || true
          sudo rm -rf /tmp/* /var/tmp/* || true
          df -h

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/niche-video-worker:latest
          # inline cache only — GHA cache + huge torch layers blow self-hosted disk
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/niche-video-worker:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/niche-video-worker:buildcache,mode=max
